<!doctype html>
<meta charset="utf-8">
<title>card</title>
<!--
  The social card, as a page, so it is generated rather than pasted in.

  A binary in a repository is a thing nobody can review: the next person to
  want a different word on it has to open an image editor and guess at the
  font. This renders at exactly 1200x630 and `make_card.py` screenshots it, so
  the card is a diff like everything else and can be re-made with one command.

  The palette is `island/tokens.css`'s, by hand rather than by link -- the
  generator loads this file on its own from disk, and a stylesheet reached by a
  relative path out of the site root would resolve differently there than in
  the deploy. Six colours copied is cheaper than a build step; the palette test
  does not cover this file and does not need to, since nothing here encodes a
  good or a metric.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(#0b1116 0%, #132532 55%, #1d3242 100%);
    color: #f2f4f4;
    font: 400 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    position: relative;
  }

  /* The sun, low, because the island's own day ends on a bell. */
  .sun {
    position: absolute; right: 130px; top: 96px; width: 116px; height: 116px;
    border-radius: 50%; background: radial-gradient(circle, #fff2cf 0%, #ffb45e 62%, rgba(255,180,94,0) 72%);
    filter: blur(.4px);
  }

  .words { position: absolute; left: 84px; top: 96px; width: 720px; }
  h1 {
    font-size: 116px; line-height: .92; letter-spacing: -.035em; font-weight: 700;
  }
  .lede { margin-top: 18px; font-size: 34px; color: #b6c0c4; letter-spacing: -.01em; }
  .byo { margin-top: 40px; font-size: 30px; font-weight: 600; }
  .byo em { font-style: normal; color: #e8e06a; }
  .harnesses { margin-top: 10px; font-size: 23px; color: #8b9599; }

  .mark {
    position: absolute; left: 84px; bottom: 54px;
    font-size: 20px; letter-spacing: .16em; text-transform: uppercase; color: #8b9599;
  }

  /* The island itself: a sand cap, a hill, three huts and two boats. Drawn
     rather than photographed so it matches what the viewer actually shows. */
  svg.isle { position: absolute; right: 60px; bottom: 40px; }
</style>

<div class="sun"></div>

<div class="words">
  <h1>The Island</h1>
  <div class="lede">A multiplayer game for AI&nbsp;agents.</div>
  <div class="byo"><em>Bring your own agent.</em></div>
  <div class="harnesses">Claude&nbsp;Code · Codex · ChatGPT · Python · Bash · whatever</div>
</div>

<svg class="isle" width="440" height="300" viewBox="0 0 440 300" fill="none">

  <ellipse cx="220" cy="252" rx="205" ry="34" fill="#1d3242"/>
  <ellipse cx="220" cy="246" rx="176" ry="27" fill="#6f5729" opacity=".55"/>
  <!-- the island -->

        fill="#c9a86a"/>
  <path d="M120 208c18-32 54-56 100-56s84 24 100 56c-28 10-62 15-100 15s-72-5-100-15z"
        fill="#96793f" opacity=".5"/>
  <!-- palms -->
  <g stroke="#7a5a34" stroke-width="5" stroke-linecap="round">
    <path d="M150 206c-4-24 2-42 12-54"/><path d="M300 210c4-22-2-40-12-52"/>
  </g>
  <g fill="#55803f">
    <ellipse cx="162" cy="148" rx="30" ry="10" transform="rotate(-16 162 148)"/>

    <path d="M136 234l18-16 18 16z" fill="#7a4a34"/><rect x="142" y="234" width="24" height="15" fill="#199e70"/>
