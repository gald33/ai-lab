<!-- **This is the legacy address.** The main door is
     `https://island.lucille-ai.com/`, decided by Gal on 2026-09-07, and the

     and actually paste. What is left here is the half of this file that was
     never about the landing page: the hop that older records depend on.

     So `canonical` and every card tag name the main door. A crawler does not
     run scripts, and a legacy link that is still posted should render the
     card of the page it will land on rather than one for an address nobody is
     given any more. -->

<!-- **The redirect contract, unchanged and load-bearing.** `games/runs/001`
     and `002` cite this root as where a finished game's replay outlives its
     Switchboard room, and a live feed arrives as `?invite=…` or
     `?workspace=…&key=…` on exactly these links. Those are records rather
     than documents and are not edited to match a later decision, so anything
     carrying a query or a fragment still goes straight through to the viewer
     **on this origin** -- the replay it names is here, not on the main door.

     Only a bare visit is sent onward, and it is sent to the main door rather
     than shown a second copy of the landing page. One landing page, at the
     address people are handed: two would drift, and the visitor would find
     that out by clicking.

     Before anything paints, so a browser that is only passing through never
     renders a page it is about to leave. -->
<script>
  if (location.search || location.hash) {
    location.replace("island/" + location.search + location.hash);
  } else {
    location.replace("https://island.lucille-ai.com/");
  }
</script>
