<title>The Island Replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f7f4ee; --surface:#fffdf9; --sunk:#eee9e0;
  --ink:#1b2227; --ink-2:#4a5a66; --ink-3:#7d8b95;
  --rule:#ddd6ca; --rule-2:#c8bfb0;
  --sea:#3d5a6c; --bell:#c8761f; --gain:#2f7d5b; --ruin:#a63d2a;
  --shadow:0 1px 2px rgba(27,34,39,.06),0 8px 24px rgba(27,34,39,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11171c; --surface:#171f26; --sunk:#0d1216;
    --ink:#e8e3d9; --ink-2:#a5b1ba; --ink-3:#6d7c86;
    --rule:#28323a; --rule-2:#3a4750;
    --sea:#7fa8bf; --bell:#e0954a; --gain:#5fb98c; --ruin:#d9705a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#11171c; --surface:#171f26; --sunk:#0d1216;
  --ink:#e8e3d9; --ink-2:#a5b1ba; --ink-3:#6d7c86;
  --rule:#28323a; --rule-2:#3a4750;
  --sea:#7fa8bf; --bell:#e0954a; --gain:#5fb98c; --ruin:#d9705a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.ui{font-family:"Archivo Narrow","Arial Narrow",system-ui,sans-serif}
.lbl{
  font-family:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3);
}
.num{font-variant-numeric:tabular-nums}

header{
  display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  padding:18px 22px 14px; border-bottom:1px solid var(--rule);
}
header h1{
  font-family:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  font-size:23px; font-weight:700; letter-spacing:.01em; margin:0;
}
header .sub{color:var(--ink-2); font-size:12px; max-width:62ch}
header .spacer{flex:1}
button,select{font:inherit; color:inherit}
.ghost{
  background:var(--surface); border:1px solid var(--rule-2); border-radius:3px;
  padding:5px 11px; cursor:pointer;
}
.ghost:hover{border-color:var(--sea)}
.ghost:focus-visible,select:focus-visible{outline:2px solid var(--bell); outline-offset:2px}

main{display:grid; grid-template-columns:236px minmax(0,1fr) 268px; gap:0; height:calc(100vh - 166px); min-height:440px}
@media (max-width:1080px){
  main{grid-template-columns:1fr; height:auto}
  .rail,.state{border-right:0; border-bottom:1px solid var(--rule)}
  .board{height:60vh}
}
.rail,.state{overflow-y:auto; padding:16px 14px; background:var(--sunk)}
.rail{border-right:1px solid var(--rule)}
.state{border-left:1px solid var(--rule); background:var(--sunk)}
.rail .lbl,.state .lbl{margin:0 0 8px}
.rail select{width:100%; background:var(--surface); border:1px solid var(--rule-2); border-radius:3px; padding:5px 7px; margin-bottom:16px}
.takes{display:flex; flex-direction:column; gap:3px}
.take{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px;
  background:none; border:0; border-left:3px solid transparent; border-radius:2px;
  padding:5px 8px; cursor:pointer; text-align:left; color:var(--ink-2); font-size:12px;
}
.take:hover{background:var(--surface); color:var(--ink)}
.take[aria-current="true"]{background:var(--surface); border-left-color:var(--bell); color:var(--ink); font-weight:600}
.take .w{font-variant-numeric:tabular-nums; font-size:11px}
.take .w.up{color:var(--gain)} .take .w.dn{color:var(--ruin)}

.board{overflow-y:auto; padding:14px 22px 28px; background:var(--paper); scroll-behavior:smooth}
.msg{display:grid; grid-template-columns:52px 66px minmax(0,1fr); gap:12px; padding:5px 0; border-bottom:1px solid var(--rule); animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}}
.msg .t{color:var(--ink-3); font-size:11px; font-variant-numeric:tabular-nums; padding-top:2px}
.msg .who{
  font-family:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  font-weight:700; letter-spacing:.04em; font-size:12px; padding-top:2px;
}
.msg .body{white-space:pre-wrap; overflow-wrap:anywhere}
.msg.manager .who{color:var(--sea)}
.msg.manager .body{color:var(--ink-2)}
.msg.bell{background:color-mix(in srgb,var(--bell) 9%,transparent); border-bottom-color:var(--bell)}
.msg.bell .who{color:var(--bell)}
.t1{color:#7a5aa8} .t2{color:#2f7d5b} .t3{color:#b3462f} .t4{color:#2f6f9f}
:root[data-theme="dark"] .t1,:root:not([data-theme="light"]) .t1{color:#b49ada}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .t2{color:#5fb98c}:root:not([data-theme="light"]) .t3{color:#d9705a}:root:not([data-theme="light"]) .t4{color:#7fa8bf}}
:root[data-theme="dark"] .t2{color:#5fb98c}:root[data-theme="dark"] .t3{color:#d9705a}:root[data-theme="dark"] .t4{color:#7fa8bf}
.empty{color:var(--ink-3); padding:40px 0; text-align:center}

.card{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:10px 11px; margin-bottom:9px; box-shadow:var(--shadow)}
.card .top{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.card .nm{font-family:"Archivo Narrow","Arial Narrow",system-ui,sans-serif; font-weight:700; font-size:14px; letter-spacing:.04em}
.card .g{font-variant-numeric:tabular-nums; font-size:13px; font-weight:600}
.card .g.up{color:var(--gain)} .card .g.dn{color:var(--ink-2)} .card .g.zero{color:var(--ruin)}
.bars{display:flex; flex-direction:column; gap:3px; margin-top:7px}
.bar{display:grid; grid-template-columns:38px 1fr 34px; align-items:center; gap:6px; font-size:10px; color:var(--ink-3)}
.bar .track{display:block; height:6px; background:var(--sunk); border-radius:3px; overflow:hidden}
.bar .fill{display:block; height:100%; background:var(--sea); border-radius:3px; transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.bar .fill{transition:none}}
.bar .v{text-align:right; font-variant-numeric:tabular-nums}
.bar.out .fill{background:var(--ruin)}
.welfare{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:10px 11px; margin-bottom:9px}
.welfare .big{font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1}
.welfare .big.up{color:var(--gain)} .welfare .big.dn{color:var(--ruin)}
.welfare .note{font-size:11px; color:var(--ink-3); margin-top:4px}

footer{border-top:1px solid var(--rule); background:var(--sunk); padding:10px 22px 14px; display:flex; flex-direction:column; gap:8px}
.transport{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.play{width:34px; height:34px; border-radius:50%; border:1px solid var(--rule-2); background:var(--surface); cursor:pointer; display:grid; place-items:center; font-size:13px}
.play:hover{border-color:var(--bell)}
.clock{font-variant-numeric:tabular-nums; font-size:14px; min-width:82px}
.speeds{display:flex; gap:3px}
.speeds button{background:none; border:1px solid transparent; border-radius:3px; padding:3px 8px; cursor:pointer; color:var(--ink-3); font-size:12px}
.speeds button[aria-pressed="true"]{border-color:var(--rule-2); background:var(--surface); color:var(--ink)}
.scrub{position:relative; height:26px; cursor:pointer}
.scrub .track{position:absolute; top:11px; left:0; right:0; height:4px; background:var(--rule); border-radius:2px}
.scrub .done{position:absolute; top:11px; left:0; height:4px; background:var(--sea); border-radius:2px}
.scrub .ep{position:absolute; top:6px; width:1px; height:14px; background:var(--rule-2)}
.scrub .mark{position:absolute; top:3px; width:2px; height:20px; background:var(--bell); opacity:.8}
.scrub .head{position:absolute; top:5px; width:3px; height:16px; background:var(--ink); border-radius:1px; margin-left:-1px}
.scrub:focus-visible{outline:2px solid var(--bell); outline-offset:3px; border-radius:3px}
</style>
