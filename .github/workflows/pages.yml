name: Deploy the island viewer (GitHub Pages)

# Publishes experiments/005-deliberation-protocol/viewer -- the spectator
# page, its saved replays, and its scoreboard -- to
# https://gald33.github.io/ai-lab/island/.
#
# **Under `island/`, not at the root, because the island is one game and there
# will be others.** The root is a games index, and a game that owns the whole
# site is a site that has to be rearranged the first time a second game wants
# a page. Everything in `web/` fetches by relative path, so the tree moves
# whole and nothing inside it changes.
#
# The root also **redirects** to `island/`, because
# https://gald33.github.io/ai-lab/ is already written down in places that are
# records rather than documents -- games/runs/001 and 002 each cite it as
# where a finished game's replay outlives its Switchboard room. Those records
# are not edited to match a later decision; the redirect is what keeps them
# true.
#
# Same origin switchboard's own published viewer uses (gald33.github.io),
# just a different path, which is why the managed hub's existing
# SWITCHBOARD_CORS_ORIGINS (https://gald33.github.io in switchboard's
# docker-compose.yml) already covers this page for the live-against-the-hub
# feed: no change needed on that side. See
# experiments/005-deliberation-protocol/viewer/web/feeds.js and
# games/island.md ("the wrapper stays a separate project that plugs into the
# published viewer for its data stream").
#
# The site's replay trees mirror serve.py's ROOTS: `results/` is this
# experiment's, `replays/` is games/replays -- replays kept on purpose so a
# finished game has a link after its Switchboard room is gone -- and
# `ceiling/` is 007's exported rounds.
#
# `web/` fetches "api/boards" and "api/scores" as relative paths; serve.py
# answers those from a running process, and there is none here, so
# freeze_static.py runs the same two computations once and writes their
# answers to disk under the same relative paths. Nothing in web/ changes.
#
# One manual step, once per repo, same as switchboard's pages.yml notes:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# The workflow's token cannot flip this (it needs admin), so this job fails
# at `configure-pages` with a bare `Not Found` until it is set by hand -- an
# unset setting, not a broken workflow. Re-run after flipping it.

on:
  push:
    branches: [main]
    paths:
      - experiments/005-deliberation-protocol/viewer/**
      - experiments/007-execution-ceiling/replays/**
      - games/replays/**
      # The hand's lobby, which the island lobby has linked to since it was
      # written and which this workflow never published -- so the link 404'd
      # from the day it shipped. A dead link is silent: it only shows up if
      # somebody clicks.
      - games/island/hand/**
      # The front door. Without this the landing page deploys once, by
      # accident, on somebody else's push -- the same silent-dead-link
      # failure the hand's pages had above.
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: experiments/005-deliberation-protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage the site
        run: |
          mkdir -p "$RUNNER_TEMP/site/island"
          cp -r viewer/web/. "$RUNNER_TEMP/site/island/"
          cp -r results "$RUNNER_TEMP/site/island/results"
          # Game replays kept on purpose, from outside this experiment's tree.
          # One prefix per root in serve.py's ROOTS, which is what freeze_static
          # writes into api/boards -- so the copy and the listing cannot
          # disagree about where a board lives.
          if [ -d ../../games/replays ]; then
            cp -r ../../games/replays "$RUNNER_TEMP/site/island/replays"
          fi
          # 007's exported rounds, under the prefix serve.py gives them.
          if [ -d ../007-execution-ceiling/replays ]; then
            cp -r ../007-execution-ceiling/replays "$RUNNER_TEMP/site/island/ceiling"
          fi
          # The hand's lobby: play a seat yourself, from the page. Only the
          # web assets -- the .py files beside them are the generators these
          # were ported from and are referenced nowhere at runtime.
          if [ -d ../../games/island/hand ]; then
            mkdir -p "$RUNNER_TEMP/site/island/hand"
            cp ../../games/island/hand/*.html ../../games/island/hand/*.js \
               "$RUNNER_TEMP/site/island/hand/"
          fi
          python viewer/freeze_static.py "$RUNNER_TEMP/site/island/api"

      # A stable public page per game, so a result is something somebody can
      # send. **Static, one file each**, because Open Graph is read by crawlers
      # that do not run scripts: a single page looking up `?game=` in the
      # browser would render a perfect card for a visitor and an empty one for
      # every link preview, which is the audience a result URL exists for.
      #
      # Built from the ledger and not from the board files, so a game whose
      # replay has been pruned still has a page -- it says the replay is gone
      # rather than 404ing, and the row it quotes is intact either way.
      - name: Stage the result pages
        run: python viewer/results.py "$RUNNER_TEMP/site/island/g"

      # The root: **the legacy address**. The front door is
      # island.lucille-ai.com, decided by Gal 2026-09-07, and the landing page
      # lives in games/island/lobby-web/ where Vercel deploys it. This root got
      # the landing page first (2026-09-06, on the measurement in
      # games/island.md, "The score nobody could beat") and that was the right
      # page at the wrong address: the card and the premise sat where nobody is
      # handed a link, while the address people paste served a seven-line
      # lobby. There is one landing page now, and it is at the main door.
      #
      # **The redirect is kept for the links that need it**, inside the page:
      # anything arriving with a `?` or a `#` still goes through to the viewer
      # ON THIS ORIGIN, because games/runs/001 and 002 cite this root as where
      # a finished game's replay outlives its Switchboard room, and a live feed
      # arrives as `?invite=…` or `?workspace=…&key=…` on exactly these links.
      # Those are records rather than documents and are not edited to match a
      # later decision -- and the replay each names is here, not on the main
      # door. Only a bare visit is sent onward.
      #
      # It is a real file under `site/` rather than a heredoc here, for the
      # reason the lobby's page moved out of `lobby_page.py`: a page inside a
      # workflow is a page no test can load and no browser check can drive.
      # `site/tests/` drives this one. Its stylesheet is `island/tokens.css`,
      # already staged above, so there is nothing else to copy.
      - name: Stage the front door
        run: cp ../../site/index.html "$RUNNER_TEMP/site/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
