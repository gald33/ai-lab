# What the island *draws*, in a real browser — and only when the drawing changed.
#
# Split out of `tests.yml` on 2026-09-09 (Gal: "drawing CI is relevant only
# when some folders have changes, not any repo change"). These two jobs are the
# most expensive things this repository runs — two browsers, ~16 minutes each,
# in parallel — and until now they ran on every push and every pull request,
# including ones whose whole diff was a roadmap item or a report.
#
# That is not merely wasteful. A 16-minute render that can fail for reasons
# unrelated to the diff, gating a change that cannot possibly have affected it,
# turns a red tick into noise — and a red tick nobody believes is the same
# problem as a green one that checked nothing, which `CLAUDE.md` already has
# three entries about.
#
# **Why a separate workflow rather than a job-level `if`.** GitHub's `paths:`
# filter is a workflow-level trigger, so per-job gating would need a
# third-party changed-files action. `CONTRIBUTING.md` says this lab has no CI
# beyond what earns its place; a supply-chain dependency to skip a job does not
# earn it, and `pages.yml` already gates itself exactly this way.
#
# **What is in the filter is what `render.py` actually reads**: the viewer it
# drives, the harness itself, and the curated replays it renders. Nothing else
# decides what gets drawn.
#
# One caveat, stated rather than encoded: the `overhead` check currently
# borrows a board from `serve.py:boards()`, which spans `results/` and the
# ceiling replays too and is ordered by file mtime — so today a board added
# elsewhere *can* change what that one check renders. That is a fragility in
# the check (reported on #246), not a reason to widen this filter until every
# experiment run drags two browsers behind it. Fix the check; do not pay for it
# here.
name: drawing

on:
  pull_request:
    paths: &drawing_paths
      - experiments/does-a-content-free-protocol-help/viewer/**
      - games/replays/**
      - experiments/do-they-take-a-handed-over-answer/replays/**
      - .github/workflows/drawing.yml
  push:
    branches: [main]
    paths: *drawing_paths

jobs:
  drawing-quick:
    runs-on: ubuntu-latest
    # **A job that cannot skip silently must not be able to hang silently
    # either.** That is the same failure mode wearing a different hat: a run
    # that never ends reports nothing, exactly like a run that checked nothing,
    # and GitHub's own default would let it sit for six hours first.
    #
    # The number is set from measurement, not taste. A run that finishes under
    # the limit was slow, and one that trips it was stuck -- which is the only
    # thing that can be known about a job whose logs arrive when it ends.
    #
    # **22 against a measured 16m55s**, which is this job's own green run on a
    # runner rather than a number carried over from the suite it was split out
    # of. It stood at 40 for one push -- inherited from the whole suite's
    # 32m04s, because the rule above is an honest measured number or nothing
    # and this job had never run -- and it is measured now, so it is set:
    # 16m55s for the job, 16m10s of that in `render.py` itself.
    #
    # **The 45s between those two numbers left with the `pages` job** on
    # 2026-09-04, so this job is `render.py` and nothing else now. The limit
    # stays where it is: what it is set against is the render, which has not
    # changed, and moving a limit down by less than a minute buys nothing and
    # spends the margin the paragraph above is careful about.
    #
    # A quarter in hand, the same margin 40 was to 32m04s. Four green runs land
    # between 14m24s and 17m39s, worst case 80% of this limit.
    #
    # A range, and not a spread figure, because this comment has carried three
    # of those and every one was moved by the next run. What the limit is set
    # against is the worst seen. Raise it if a green run ever comes in near it
    # -- past 19 minutes, not merely past the last number written here -- and
    # never to get past a hang. `viewer/README.md` has the four runs, and what
    # believing three of them cost.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: >
          python experiments/does-a-content-free-protocol-help/viewer/tests/render.py
          --require --group quick --out "$RUNNER_TEMP/island-shots"
      # The pictures the run measured, kept whether it passed or failed: a
      # threshold on a rendered image is not arguable without the image.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-shots-quick
          path: ${{ runner.temp }}/island-shots
          if-no-files-found: warn

  # The four checks the clock singles out. `palette` is 318s of it on its own:
  # it plays a 162-frame game through and every frame is held for as long as
  # its animation draws, so that is the game being played rather than the
  # harness waiting, and it is the floor under any split of this suite.
  drawing-slow:
    runs-on: ubuntu-latest
    # 22 for the reasoning spelled out on `drawing-quick` above. Four green
    # runs land between 14m49s and 17m24s, worst case 79% of this limit -- so
    # on a runner this job and `quick` cover much the same range, and which of
    # the two is the gate varies from run to run.
    #
    # **This comment used to claim the two scale differently, and that claim is
    # retracted.** `palette` is bound by wall-clock animation dwells rather
    # than by the CPU, so a job that is mostly `palette` should vary less --
    # and after three runs this one had moved 2.1% against `quick`'s 17.5%,
    # which read as the mechanism proving itself. The fourth run came in at
    # 14m49s and the eight-fold difference was gone.
    #
    # The arithmetic that should have stopped the claim was there all along:
    # `palette` is 318s of this job's 589s, so **46% of it is CPU-bound like
    # everything in `quick`**. The honest prediction was "somewhat less
    # variable", never "barely varies". See `viewer/README.md`.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: >
          python experiments/does-a-content-free-protocol-help/viewer/tests/render.py
          --require --group slow --out "$RUNNER_TEMP/island-shots"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-shots-slow
          path: ${{ runner.temp }}/island-shots
          if-no-files-found: warn
