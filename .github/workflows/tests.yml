# The island's tests, on every change that touches them.
#
# Until this existed, `roadmap` was the only check on a pull request -- it
# checks the roadmap, installs no dependency of the game and runs no test. A
# green tick therefore said nothing about the 192 tests, which had only ever
# passed on whichever machine happened to run them by hand.
#
# The hub these tests drive is a real one on a loopback port, so nothing here
# reaches the network and nothing here touches the live lobby.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  island:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r games/island/requirements-dev.txt
      # `viewer/tests` was missing from this line and had never been run by
      # anything but a hand -- 194 tests on the ledger, the roots, the
      # scoreboard and the palette, none of them behind a green tick. It hid a
      # real failure for long enough to be found by accident: a test asserting
      # every recorded round was four-good, against a ledger that had since
      # grown four five-good rounds.
      - run: >
          python -m pytest
          games/island/tests
          experiments/005-deliberation-protocol/tests
          experiments/005-deliberation-protocol/viewer/tests
          -q

  # The viewer's own tests, which are node's and were never run by anything
  # but a hand. They are the checks on what the island *draws* -- what a clip
  # borrows and gives back, what the light does to the colour of the grass --
  # and a green tick that did not include them said nothing about any of it.
  # They need no dependency: three is vendored in the checkout.
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test experiments/005-deliberation-protocol/viewer/tests/*.test.mjs


  # What the island *draws*, in a real browser. `render.py` is the only check
  # on card and hut placement, on scenery not landing on a shelf, on the chrome
  # not covering the cards and on the light being on the day's clock -- and
  # until now nothing ran it, so none of that was covered by a green tick.
  #
  # **`--require` is the whole point of the invocation.** `render.py` skips
  # cleanly when there is no playwright, no browser or no replay, which is
  # right locally and is exactly the failure mode a CI job must not have: a
  # skip and a pass look identical in a tick. With the flag each of those is a
  # failure instead, so this job cannot go green having rendered nothing.
  #
  # Two failures predate this job and are tracked in `KNOWN_FAILURES` rather
  # than fixed here or silenced -- see `render.py`. Anything else fails, and so
  # does a listed failure that stops reproducing.
  drawing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: >
          python experiments/005-deliberation-protocol/viewer/tests/render.py
          --require --out "$RUNNER_TEMP/island-shots"
      # The pictures the run measured, kept whether it passed or failed: a
      # threshold on a rendered image is not arguable without the image.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-shots
          path: ${{ runner.temp }}/island-shots
          if-no-files-found: warn
