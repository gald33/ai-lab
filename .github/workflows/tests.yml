# The island's tests, on every change that touches them.
#
# Until this existed, `roadmap` was the only check on a pull request -- it
# checks the roadmap, installs no dependency of the game and runs no test. A
# green tick therefore said nothing about the 192 tests, which had only ever
# passed on whichever machine happened to run them by hand.
#
# The hub these tests drive is a real one on a loopback port, so nothing here
# reaches the network and nothing here touches the live lobby.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  island:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r games/island/requirements-dev.txt
      # `viewer/tests` was missing from this line and had never been run by
      # anything but a hand -- 194 tests on the ledger, the roots, the
      # scoreboard and the palette, none of them behind a green tick. It hid a
      # real failure for long enough to be found by accident: a test asserting
      # every recorded round was four-good, against a ledger that had since
      # grown four five-good rounds.
      # `games/carmel-taldiego` joined this line with its first test and not
      # afterwards, because a test file outside every path listed here is a
      # test file nothing runs -- the same shape as the `viewer/tests`
      # omission above, found the same way and worth only one paragraph
      # because the fix is the same: name the directory.
      #
      # **Eight of the repo's thirteen test directories were missing from this
      # line**, surveyed 2026-09-09: `island/tests` (which had two failing
      # tests nobody could see), `experiment/tests`, and every other
      # experiment's suite -- 321 tests in 52s, none of them behind a tick.
      # Two of those omissions are described above as one-offs; four is not a
      # run of bad luck, it is a hand-maintained list drifting from the tree.
      #
      # So `tools/tests/test_workflows.py` now derives the answer instead:
      # every directory holding a `test_*.py` must be named here, and an
      # exception has to be written down with its reason. That test is what
      # keeps this list honest; this list is no longer what keeps itself
      # honest.
      - run: >
          python -m pytest
          games/island/tests
          games/carmel-taldiego
          experiments/does-a-content-free-protocol-help/tests
          experiments/does-a-content-free-protocol-help/viewer/tests
          experiments/does-a-content-free-protocol-help/experiment/tests
          experiments/does-a-content-free-protocol-help/island/tests
          experiments/do-they-take-a-handed-over-answer/tests
          experiments/does-telling-traders-what-to-disclose-help/tests
          experiments/how-wrong-can-a-shared-convention-be/tests
          experiments/which-part-of-a-convention-works/experiment/tests
          experiments/which-promotion-rule-beats-luck/experiment/tests
          tools/tests
          -q

  # The viewer's own tests, which are node's and were never run by anything
  # but a hand. They are the checks on what the island *draws* -- what a clip
  # borrows and gives back, what the light does to the colour of the grass --
  # and a green tick that did not include them said nothing about any of it.
  # They need no dependency: three is vendored in the checkout.
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test experiments/does-a-content-free-protocol-help/viewer/tests/*.test.mjs


  # What the island *draws*, in a real browser. `render.py` is the only check
  # on card and hut placement, on scenery not landing on a shelf, on the chrome
  # not covering the cards and on the light being on the day's clock -- and
  # until it was put in CI nothing ran it, so none of that was covered by a
  # green tick.
  #
  # **`--require` is the whole point of the invocation, and `--group` does not
  # weaken it.** `render.py` skips cleanly when there is no playwright, no
  # browser or no replay, which is right locally and is exactly the failure
  # mode a CI job must not have: a skip and a pass look identical in a tick.
  # With the flag each of those is a failure instead -- and so is a `--group`
  # that matches no check, which is the one new way a run could have gone green
  # having rendered nothing. Both jobs below carry the flag, and between them
  # they carry every group there is: `test_render_gate.py` reads this file and
  # fails if a group is added to `render.py` and not to it.
  #
  # The page checks that used to trail `render.py` here are the `pages` job
  # above, since 2026-09-04. Both jobs below are `render.py` alone.
  #
  # **Two jobs, and the split is by measured cost.** In one job the suite took
  # 32m04s on a runner; these two take 16m55s and 17m16s, and run at once, so
  # the gate is 17m16s. The obvious division -- structure is cheap, the checks
  # that read the model's pixels are dear -- is not what the clock says: those
  # four pixel checks are 90 seconds of a 1063-second run, and four checks
  # nobody would have picked out (`palette`, `island`, `replay`, `overhead`)
  # are 590 of it. So `slow` is those four and `quick` is the other
  # twenty-three, which is 590s against 473s on a GPU-less developer machine.
  # The two run at once, so the gate is the longer of them rather than the sum.
  # `render.py` prints the table that settles this every run; `viewer/README.md`
  # carries it, and the rule for moving a check between groups.
  #
  # **Held back once, and back because the reason it was held is fixed.** #187
  # removed this job after it failed twice on one commit with a different
  # failure each time: the suite was flaky on a runner with no GPU, and a check
  # that goes red at random teaches everyone to ignore CI. That is now root-
  # caused and fixed -- the page renders at 2 frames a second with the stage
  # running and 25 with it paused, and the samples that raced those frames are
  # observers and watchers now. `--require` on one commit gives the same result
  # on four consecutive runs, and `ring` alone on five more with every core
  # saturated. `viewer/README.md` carries the measurements and the reproduction.
  #
  # `KNOWN_FAILURES` is empty as of #186 and #188, which fixed both entries, so
  # these jobs are green on nothing but a clean run: anything failing fails
  # them, and so would a listed failure that stopped reproducing.
  # What the island's pages *do*, in a real browser. Split out of
  # `drawing-quick` on 2026-09-04, and the reason is the failure that prompted
  # it rather than tidiness.
  #
  # **These steps sat after `render.py` in one job, so a red render skipped
  # every one of them.** That happened on #220: the viewer's `recorded` check
  # timed out mounting, and the six checks below -- the hand's cryptography,
  # its two pages, the lobby's countdowns, the served lobby's levers and what
  # it reads -- reported nothing at all, on a pull request whose whole diff was
  # two of those pages. The job went red for a reason unconnected to the
  # change, and the checks that covered the change never ran.
  #
  # That is the same defect `--require` and `ISLAND_REQUIRE_BROWSER` exist to
  # prevent, arriving by another route: not a skip drawn as a pass, but a skip
  # hidden behind somebody else's red. A gate that reports nothing about the
  # diff is not a gate, whichever colour the tick is.
  #
  # **Nothing is turned off by this and nothing is made cheaper.** The same six
  # commands run, under the same flags, on the same browser; they run in a job
  # of their own so that what covers a page reports on a page. They take about
  # a minute against `render.py`'s sixteen, so they also report first, which is
  # the smaller half of the point.
  #
  # `--require`'s counterpart here is `ISLAND_REQUIRE_BROWSER`: without it each
  # of these skips where there is no playwright and no browser, which is right
  # on a laptop and is exactly what must not happen here.
  pages:
    runs-on: ubuntu-latest
    # A minute's work, and the limit is set the way the drawing jobs' are:
    # against what a green run costs, with room for a slow runner. Raise it
    # only on a green run that comes in near it, never to get past a hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      # The lobby's own browser check. The `island` job collects it and skips
      # it, and a skip and a pass look identical in a tick. It is the only
      # test that can see the failure it was written for: the countdown script
      # sat above the tables it drove, matched no elements, and every clock on
      # the page was frozen while every markup assertion around it passed.
      - run: pip install -r games/island/requirements-dev.txt
      # The launch counters, offline: no hub, no flake, and still a real
      # answer off the ledger.
      - run: python -m pytest games/island/tests/test_pulse.py -q
      - run: python -m pytest games/island/tests/test_lobby_page.py -q -k browser
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The hand's cryptography, here for the same reason and against a worse
      # failure. `games/island/hand/switchboard.js` is a second implementation
      # of Switchboard's wire format, written because a hand plays from a
      # phone and a phone cannot run their Python -- and every way it can be
      # wrong is silent. A NUL written as a space, a JSON key out of order, an
      # HKDF `info` a byte off: nothing raises, and what happens instead is an
      # envelope that will not open in the middle of somebody's episode.
      #
      # So the test crosses the language boundary in both directions -- Python
      # seals and the browser opens, the browser seals and Python opens -- and
      # it needs a browser to do it. `ISLAND_REQUIRE_BROWSER` for the reason
      # above: a skip and a pass are the same tick.
      - run: python -m pytest games/island/tests/test_hand_crypto.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # Carmel's flight, which is the only page in the repo whose whole
      # point is motion: the camera pulls back while she is in the air and
      # closes on the room she lands in. A markup assertion cannot see a
      # camera move, and `games/carmel-taldiego.md` ("Three maps") turns on the
      # page disclosing no landmark but the ones she visited -- which a
      # zoomed-out frame could break without a single tag changing.
      #
      # `HUE_REQUIRE_BROWSER` is `ISLAND_REQUIRE_BROWSER`'s counterpart for
      # this game, and for the same reason: the `island` job collects these
      # tests and skips them, and a skip and a pass are the same tick.
      - run: python -m pytest games/carmel-taldiego/test_trail_flight.py -q
        env:
          HUE_REQUIRE_BROWSER: "1"
      # The hand's two pages and the grammar its buttons compose. Both are
      # here for the reason the lobby's countdown test is: they check what a
      # page *does*, which no assertion on rendered markup can see.
      #
      # `test_hand_lobby_lines.py` pits the JS composer against
      # `protocol.py` in both directions -- a line it writes that Python
      # refuses loses a driver their table in silence, and an input it turns
      # away that Python allows shrinks the game for nothing.
      #
      # `test_hand_play_lines.py` does the same for the island's own four
      # forms, which the kids' page composes from sliders and dropdowns. A
      # driver who types `PROPOSE` reads the manager's refusal; a child who
      # pressed a button does not, so a composer one commit behind the parser
      # costs them the day in silence. It also pins the three things that page
      # reads back off the manager's prose against a **real `Manager`'s**
      # output rather than invented lines.
      #
      # `test_hand_pages.py` drives the pages against a real hub and reads
      # what they posted back with a real Python client. It also serves
      # `kids-island.html` and `play.html` in the layout the deploy really
      # uses -- the viewer's modules at the root, the hand's pages one
      # directory down -- because those pages import `../stage.js` and
      # `../reducer.js`, and a flat fixture would serve a page that could
      # never exist while the deployed one 404ed on its own island. That page's check reads the **canvas back as pixels**:
      # a WebGL island that threw leaves a rectangle no markup assertion can
      # tell from a drawn one. That is the only
      # check on the wire format: sealing contexts, the `{b, ch, s}` wrapper,
      # and a signature computed over the right channel. It caught the
      # signature being over the blinded channel instead of the plaintext
      # one -- a line that posts, arrives, opens, and verifies as `mismatch`,
      # which is invisible from inside the browser.
      - run: >
          python -m pytest games/island/tests/test_hand_lobby_lines.py
          games/island/tests/test_hand_play_lines.py
          games/island/tests/test_hand_pages.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The lobby's own port, against the Python it ports. `lobby-web/` is what
      # island.lucille-ai.com actually serves, and nothing compared it to
      # `lobby_page.py` -- so `TRADERS_MAX` came down to 4 and `GOODS_MAX` to 5
      # in `protocol.py`, the Python page followed, and the served page went on
      # offering 8 traders and 12 goods that the lobby refuses. Every test in
      # the suite was green throughout, because every one of them read the
      # Python. Here for the same reason as the two above: it runs the port's
      # real modules, which needs a browser.
      - run: python -m pytest games/island/tests/test_lobby_web_levers.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The same port, against the lines a real lobby posts. The levers check
      # above compared what the page OFFERS; nothing compared what it READS --
      # so `lobby.js` demanded `T<n>` table ids while `lobby.py` has always
      # named them `g1`, `g2`, ..., and the served page showed no table at all
      # while the board showed `g18` forming, seating and settling. Green
      # throughout, because the only lines the port was read against were the
      # ones `fixture.html` invented.
      - run: python -m pytest games/island/tests/test_lobby_web_reconstruct.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The front door: the landing page at island.lucille-ai.com, driven
      # against the directory Vercel actually deploys rather than a fixture
      # copy. The score it quotes is fetched -- and fetched cross-origin now --
      # so its unheld and unreadable states are invisible to any assertion on
      # the file. It also asserts the Open Graph tags name THIS host and the
      # card is a file in THIS directory, which is the defect it was written
      # for: every tag was correct all along, for the other host, while the
      # address people paste served a seven-line lobby with no card at all.
      - run: python -m pytest games/island/tests/test_front_door.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The legacy root, and the redirect that is all it still is. A bare visit
      # goes to the main door; anything carrying a `?` or a `#` still hops into
      # the viewer ON THAT ORIGIN with it, because games/runs/001 and 002 cite
      # that root as where a finished game's replay lives and a live feed
      # arrives as `?invite=...` on exactly those links -- and the replay each
      # names is a file there. The hop is a script, so where a visit ends up is
      # behaviour and not markup.
      - run: python -m pytest site/tests -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The scoreboard's open-table card, for the same reason: it is written
      # entirely by a script from data it fetched, and its unheld state is the
      # one the board was actually in the day the door opened.
      - run: >
          python -m pytest
          experiments/does-a-content-free-protocol-help/viewer/tests/test_scores_page.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The per-game result pages. Most of what matters here is still a text
      # assertion -- their Open Graph tags are *in* the file, because a crawler
      # runs no scripts and these pages exist for crawlers as much as for
      # people. **This step used to say "no browser needed" and that stopped
      # being true on 2026-09-08**, when the pages gained a Copy-link button:
      # `CLAUDE.md` names "a button that copies" as the example of behaviour
      # that a fragment assertion cannot see, so one test now clicks it in a
      # real browser and reads the clipboard back.
      #
      # Here rather than in the `viewer` job because they are part of the same
      # public surface as everything above.
      - run: >
          python -m pytest
          experiments/does-a-content-free-protocol-help/viewer/tests/test_results.py -q
        env:
          ISLAND_REQUIRE_BROWSER: "1"

  # `drawing-quick` and `drawing-slow` moved to `.github/workflows/drawing.yml`
  # on 2026-09-09, so they run only when the drawing changed (Gal: "drawing CI
  # is relevant only when some folders have changes, not any repo change").
  #
  # They are two browsers at ~16 minutes each and they ran here on every push
  # and every pull request, including ones whose whole diff was a roadmap item.
  # A 16-minute render gating a change that cannot have affected it makes a red
  # tick mean nothing, which is the same disease as a green tick that checked
  # nothing -- and that one already has three entries in `CLAUDE.md`.
  #
  # Nothing was turned off. The jobs keep their names, their commands, their
  # `--require` flags and their measured 22-minute limits; only what triggers
  # them changed. `paths:` is a workflow-level trigger, which is why they are a
  # workflow of their own rather than an `if` on a job.
