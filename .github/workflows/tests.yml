# The island's tests, on every change that touches them.
#
# Until this existed, `roadmap` was the only check on a pull request -- it
# checks the roadmap, installs no dependency of the game and runs no test. A
# green tick therefore said nothing about the 192 tests, which had only ever
# passed on whichever machine happened to run them by hand.
#
# The hub these tests drive is a real one on a loopback port, so nothing here
# reaches the network and nothing here touches the live lobby.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  island:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r games/island/requirements-dev.txt
      # `viewer/tests` was missing from this line and had never been run by
      # anything but a hand -- 194 tests on the ledger, the roots, the
      # scoreboard and the palette, none of them behind a green tick. It hid a
      # real failure for long enough to be found by accident: a test asserting
      # every recorded round was four-good, against a ledger that had since
      # grown four five-good rounds.
      - run: >
          python -m pytest
          games/island/tests
          experiments/005-deliberation-protocol/tests
          experiments/005-deliberation-protocol/viewer/tests
          -q

  # The viewer's own tests, which are node's and were never run by anything
  # but a hand. They are the checks on what the island *draws* -- what a clip
  # borrows and gives back, what the light does to the colour of the grass --
  # and a green tick that did not include them said nothing about any of it.
  # They need no dependency: three is vendored in the checkout.
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test experiments/005-deliberation-protocol/viewer/tests/*.test.mjs


  # What the island *draws*, in a real browser. `render.py` is the only check
  # on card and hut placement, on scenery not landing on a shelf, on the chrome
  # not covering the cards and on the light being on the day's clock -- and
  # until it was put in CI nothing ran it, so none of that was covered by a
  # green tick.
  #
  # **`--require` is the whole point of the invocation, and `--group` does not
  # weaken it.** `render.py` skips cleanly when there is no playwright, no
  # browser or no replay, which is right locally and is exactly the failure
  # mode a CI job must not have: a skip and a pass look identical in a tick.
  # With the flag each of those is a failure instead -- and so is a `--group`
  # that matches no check, which is the one new way a run could have gone green
  # having rendered nothing. Both jobs below carry the flag, and between them
  # they carry every group there is: `test_render_gate.py` reads this file and
  # fails if a group is added to `render.py` and not to it.
  #
  # **Two jobs, and the split is by measured cost.** In one job the suite took
  # 32m04s on a runner; these two take 16m55s and 17m16s, and run at once, so
  # the gate is 17m16s. The obvious division -- structure is cheap, the checks
  # that read the model's pixels are dear -- is not what the clock says: those
  # four pixel checks are 90 seconds of a 1063-second run, and four checks
  # nobody would have picked out (`palette`, `island`, `replay`, `overhead`)
  # are 590 of it. So `slow` is those four and `quick` is the other
  # twenty-three, which is 590s against 473s on a GPU-less developer machine.
  # The two run at once, so the gate is the longer of them rather than the sum.
  # `render.py` prints the table that settles this every run; `viewer/README.md`
  # carries it, and the rule for moving a check between groups.
  #
  # **Held back once, and back because the reason it was held is fixed.** #187
  # removed this job after it failed twice on one commit with a different
  # failure each time: the suite was flaky on a runner with no GPU, and a check
  # that goes red at random teaches everyone to ignore CI. That is now root-
  # caused and fixed -- the page renders at 2 frames a second with the stage
  # running and 25 with it paused, and the samples that raced those frames are
  # observers and watchers now. `--require` on one commit gives the same result
  # on four consecutive runs, and `ring` alone on five more with every core
  # saturated. `viewer/README.md` carries the measurements and the reproduction.
  #
  # `KNOWN_FAILURES` is empty as of #186 and #188, which fixed both entries, so
  # these jobs are green on nothing but a clean run: anything failing fails
  # them, and so would a listed failure that stopped reproducing.
  drawing-quick:
    runs-on: ubuntu-latest
    # **A job that cannot skip silently must not be able to hang silently
    # either.** That is the same failure mode wearing a different hat: a run
    # that never ends reports nothing, exactly like a run that checked nothing,
    # and GitHub's own default would let it sit for six hours first.
    #
    # The number is set from measurement, not taste. A run that finishes under
    # the limit was slow, and one that trips it was stuck -- which is the only
    # thing that can be known about a job whose logs arrive when it ends.
    #
    # **22 against a measured 16m55s**, which is this job's own green run on a
    # runner rather than a number carried over from the suite it was split out
    # of. It stood at 40 for one push -- inherited from the whole suite's
    # 32m04s, because the rule above is an honest measured number or nothing
    # and this job had never run -- and it is measured now, so it is set:
    # 16m55s for the job, 16m10s of that in `render.py` itself.
    #
    # A quarter in hand, the same margin 40 was to 32m04s. Two green runs now:
    # 16m55s and 15m42s, a 7% spread, worst case 77% of this limit. Raise it if
    # a green run ever comes in near it, and never to get past a hang.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: >
          python experiments/005-deliberation-protocol/viewer/tests/render.py
          --require --group quick --out "$RUNNER_TEMP/island-shots"
      # The lobby's own browser check, here because this is a job with a
      # browser in it. The `island` job collects it and skips it, and a skip
      # and a pass look identical in a tick -- which is the same reason
      # `--require` is on the line above. It is the only test that can see the
      # failure it was written for: the countdown script sat above the tables
      # it drove, matched no elements, and every clock on the page was frozen
      # while every markup assertion around it passed.
      #
      # `ISLAND_REQUIRE_BROWSER` is this job's `--require`: without it the test
      # skips where there is no playwright and no browser, which is right on a
      # laptop and is exactly what must not happen here.
      #
      # **In this job and not `drawing-slow`, and in exactly one of them.** It
      # arrived when there was one `drawing` job to put it in. Both have a
      # browser now, so either would do and both would be the same check paid
      # for twice; it goes in the shorter one, where it reports soonest.
      - run: pip install -r games/island/requirements-dev.txt
      - run: python -m pytest games/island/tests/test_lobby_page.py -q -k browser
        env:
          ISLAND_REQUIRE_BROWSER: "1"
      # The pictures the run measured, kept whether it passed or failed: a
      # threshold on a rendered image is not arguable without the image.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-shots-quick
          path: ${{ runner.temp }}/island-shots
          if-no-files-found: warn

  # The four checks the clock singles out. `palette` is 318s of it on its own:
  # it plays a 162-frame game through and every frame is held for as long as
  # its animation draws, so that is the game being played rather than the
  # harness waiting, and it is the floor under any split of this suite.
  drawing-slow:
    runs-on: ubuntu-latest
    # 22 against a measured **17m16s** on a runner (16m43s of it in `render.py`),
    # for the reasoning spelled out on `drawing-quick` above.
    #
    # Almost exactly level with `quick`'s 16m55s, which the developer machine
    # did not predict: there the two are 531s and 598s, an 0.89 ratio, and on
    # the runner they are 1015s and 1036s, an 0.98 one. The two groups scale
    # differently because `palette` is most of this job and `palette` is bound
    # by **wall-clock animation dwells** rather than by the CPU -- a frame is
    # held for as long as its clip draws whatever the machine is doing -- so
    # this job grows by 1.73x on a slower box where `quick` grows by 1.91x.
    # Which is a happy accident for a split into two: the gate is the longer
    # job, and the longer job is barely longer.
    #
    # Two green runs: 17m16s and 17m03s, a **1.3%** spread against `quick`'s
    # 7%, which is that same explanation confirming itself -- a job whose cost
    # is animation dwells barely notices which runner it drew. Worst case is
    # 78% of this limit.
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: >
          python experiments/005-deliberation-protocol/viewer/tests/render.py
          --require --group slow --out "$RUNNER_TEMP/island-shots"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-shots-slow
          path: ${{ runner.temp }}/island-shots
          if-no-files-found: warn
