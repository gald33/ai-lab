<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>the island — lobby (fixture)</title>
<link rel=stylesheet href="./style.css">
<main></main>
<script type=module>
// Dev only. Renders the ported page from canned lobby output, so the markup
// and CSS can be checked without an allowlisted origin — the hub refuses a
// cross-origin preflight from anywhere but the origins it knows, so the live
// read cannot be exercised from localhost by design.
import { reconstruct } from "./lobby.js";
import { render } from "./render.js";
import { wireStart } from "./start.js";
import { CONFIG } from "./config.js";
const at = i => new Date(Date.UTC(2026,7,31,12,0,i)).toISOString();
// What `Lobby._stamp` writes: a bare UTC clock time, not a timestamp.
const stamp = i => at(i).slice(11, 19) + "Z";
let i = 0;
// The table ids are the lobby's own -- `g1`, `g2`, ... as `lobby.py`
// names them -- and not ids this fixture invented. A fixture that makes
// up the format it is checking against checks nothing: this one said `T1`
// while the live lobby said `g18`, and the page went quiet in production
// with every test green. Seat labels really are `T<n>`.
const lines = [
  "LOBBY holding this channel: lobby-a",
  "g1 commits ab12cd34ef5678901234 -- bring nonce=<16-64 hex digits> on your JOIN",
  "g1 is forming: 2 traders, 5 goods, 4 episodes, 1 round -- JOIN g1 as <name>, or MANAGE g1",
  "g1 seat T1 = alice, key ed25519:K1AAAAAAAAAAAAAAAAAA, sealed, nonce a1b2c3d4e5f60718 (1/2)",
  "g1 seat T2 = bob, key ed25519:K2BBBBBBBBBBBBBBBBBB, sealed, nonce 00ff11ee22dd33cc (2/2)",
  "g1 will be managed by carol, key ed25519:K3CCCCCCCCCCCCCCCCCC",
  "g1 is full: alice, bob; managed by carol; opens " + stamp(300) + "",
  "g1: the island is drawn by commit-reveal",
  "g1 invite: swb1_THIS_MUST_NEVER_RENDER",
  "g2 is forming: 3 traders, 5 goods, 2 episodes, 1 round -- JOIN g2 as <name>, or MANAGE g2",
  "g2 seat T1 = dave, key ed25519:K4DDDDDDDDDDDDDDDDDD, in the clear (1/3)",
  "@eve not settled: that table is full",
  "g3 is forming: 2 traders, 5 goods, 1 episodes, 1 round -- JOIN g3 as <name>, or MANAGE g3",
  "g3 lapsed: not full within 600s (1/2 seated)",
].map(t => ({ channel: "lobby", from: "x", created_at: at(i++), body: { text: t } }));
const view = reconstruct({ messages: lines, agents: [] }, "lobby");
// The exact path `app.js` takes on every poll: replace main.innerHTML, then
// re-wire. Exposed so a test can drive the re-render rather than imitate it --
// an open fold is destroyed by that innerHTML and has to be put back, and a
// test that called `render` on its own would not exercise the wiring.
window.__render = () => {
  document.querySelector("main").innerHTML =
    render(view, { ...CONFIG, nowHub: Date.parse(at(i)) / 1000, error: "" });
  wireStart();
};
window.__render();
// Check what was RENDERED, not the document: this file's own script
// carries the fixture string, so testing document.body reports a leak
// that is only the test looking at itself.
window.__leak = document.querySelector("main").innerHTML.includes("THIS_MUST_NEVER_RENDER");
console.log("invite leak into rendered page:", window.__leak);
</script>
